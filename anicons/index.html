<script>
  // Bootstrap enable tooltips
  const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
  const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl));
  
  const downloadAllBtn = document.getElementById('downloadAllBtn');

  downloadAllBtn.addEventListener('click', async function() {
    try {
      // Returns a Bootstrap tooltip instance
      const tooltip = bootstrap.Tooltip.getOrCreateInstance(downloadAllBtn);
      // Change tooltip text
      tooltip.setContent({ '.tooltip-inner': 'Downloading...' });
      // Reset default
      downloadAllBtn.addEventListener('mouseout', function() {
        tooltip.setContent({ '.tooltip-inner': 'Download all anicons' });
      });
    } catch (error) {
      // Optional: Display an error message to the user
      console.error('Failed to download:', error);
    }
  });
</script>

<script>
  // Trigger toast messege
  const toastMessage = document.getElementById('couponToast');
  const toastIconName = document.getElementById('toast-icon-name');
  const toastImgSrc = document.getElementById('toast-img-src');
  const allToastTriggers = document.querySelectorAll('a');

  allToastTriggers.forEach(toastTrigger => {
    toastTrigger.addEventListener('click', ()=> {
      // Take the icon's name from the alt text
      if (toastTrigger.querySelector('img')) {
        toastIconName.innerHTML = `${toastTrigger.querySelector('img').alt} anicon`;
      } else {
        toastIconName.innerHTML = 'All anicons'
      }
      // Restart Check SVG animation
      document.querySelectorAll('animate').forEach((element) => {
        element.beginElement();
      });
      // Display toast message
      const toastBootstrap = bootstrap.Toast.getOrCreateInstance(toastMessage)
      toastBootstrap.show();
    });
  });
</script>
